name: One-off release build

# 一次性自举构建：本地出网太慢（代理上行约 0.11 MB/s，252 MB 要 40 分钟且中途
# 会被重置），改由 GitHub 的 runner 构建并直接发布 release 资源。
#
# 与 monthly-data-refresh.yml 的 release job 不同，这里不重算 tag：tag 由人工
# 先行确定并作为输入传入，避免两条链路同时推算同一版本号。
#
# 用完即删。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the asset to (must already exist)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

concurrency:
  group: one-off-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build-and-attach:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 与月度链路一致：所有缓存都留在仓库内，不写宿主 profile。
      - name: Prepare repo-local caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp,.nuget-packages,.dotnet-home | Out-Null
          "NUGET_PACKAGES=$PWD/.nuget-packages" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_CLI_HOME=$PWD/.dotnet-home"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$PWD/.tmp"                     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$PWD/.tmp"                      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 发布前必须过门禁：产物要带的是通过的代码，而不是「本地跑过」的记忆。
      - name: Run gates
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/check.ps1

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Verify artifact
        shell: pwsh
        run: |
          $zip = 'dist/TarkovAtlas-win-x64.zip'
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          "zip: $size MB"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "sha256: $sha"
          $head = (git rev-parse HEAD).Trim()
          "commit: $head"
          # 产物里必须带新的楼层足迹数据，否则等于白构建。
          $idx = Get-Content 'dist/TarkovAtlas-win-x64/Assets/maps/layers/index.json' -Raw
          $n = ([regex]::Matches($idx, '"extents"')).Count
          if ($n -lt 40) { throw "index.json carries only $n extents; expected 43" }
          "extents: $n"
          # 个人状态绝不能进发布包。
          $personal = @(Get-ChildItem 'dist/TarkovAtlas-win-x64' -Recurse -File -Include 'quest-progress*.json','settings.json','crash.log')
          if ($personal.Count -gt 0) { throw "personal state in package: $($personal.Name -join ',')" }

      # 同名资源可能来自上一次失败的手动上传，先删再加，release 只留一份 zip。
      - name: Attach asset to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          $zip = 'dist/TarkovAtlas-win-x64.zip'
          $sha = (git rev-parse HEAD).Trim()
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)

          # PowerShell 的 if(<native cmd>) 判断的是输出而非退出码，必须显式比。
          gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "release $tag not found" }

          $existing = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($existing -contains 'TarkovAtlas-win-x64.zip') {
            gh release delete-asset $tag TarkovAtlas-win-x64.zip --yes
            if ($LASTEXITCODE -ne 0) { throw 'failed to delete old asset' }
          }

          gh release upload $tag $zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'upload failed' }

          $notes = @(
            'Windows x64 原生构建（NativeAOT，免装 .NET 运行时）。',
            '',
            ('产物：TarkovAtlas-win-x64.zip（{0} MB），由 GitHub Actions 构建。' -f $size),
            ('提交：{0}' -f $sha),
            ('sha256：{0}' -f (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())
          ) -join "`n"
          Add-Content $env:GITHUB_STEP_SUMMARY $notes
          Write-Host $notes

      # 失败时留日志，方便判断是构建问题还是 runner 环境问题。
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-release-logs-${{ github.run_id }}
          path: |
            .tmp/*.log
            .tmp/**/*.log
          if-no-files-found: ignore
          retention-days: 7
